<body>
  <header>
    <nav class="nav-container" aria-label="Main navigation">
      <a href="index.html" class="nav-logo">Lima Sabor</a>
      <button class="hamburger" id="ham-btn" aria-label="Navigation menu"></button>
    </nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dishes.html">Dishes</a></li>
        <li><a href="guide.html">Guide</a></li>
      </ul>
  </header>
  <main id="main-content">

    <!-- PAGE HERO -->
    <section class="page-hero" >
      <h1 id="dishes-heading">Iconic Lima Dishes</h1>
      <p>15 must-try plates that define Peru's culinary capital</p>
    </section>

    <!-- FILTER CONTROLS -->
    <div class="dishes-controls" aria-label="Filter dishes by category">
      <div class="filter-group">
        <label>Filter by category:</label>
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Seafood">Seafood</button>
        <button class="filter-btn" data-filter="Stir-fry">Stir-fry</button>
        <button class="filter-btn" data-filter="Stew">Stew</button>
        <button class="filter-btn" data-filter="Appetizer">Appetizer</button>
        <button class="filter-btn" data-filter="Street Food">Street Food</button>
        <button class="filter-btn" data-filter="Dessert">Dessert</button>
        <button class="filter-btn" data-filter="Soup">Soup</button>
      </div>

      <!-- Weather -->
      <div class="weather-widget" id="weather-widget">
        <span>📍 Lima, Peru</span>
      </div>
    </div>

    <!-- DISHES GRID -->
    <div id="dishes-grid" aria-label="Dishes list">
      <p>Loading dishes…</p>
    </div>

  </main>

  <div id="dish-modal" class="modal-overlay" aria-label="Dish details">
    <div class="modal" id="modal-content">
    </div>
  </div>
